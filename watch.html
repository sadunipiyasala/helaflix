<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch & Download - HelaFlix Stream</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #08080a;
      color: #ffffff;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    .stream-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 5%;
      background: rgba(10, 10, 14, 0.98);
      border-bottom: 1px solid #1a1a24;
    }
    .brand-logo {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #fff;
      text-decoration: none;
    }
    .brand-logo span { color: #e50914; }

    /* MAIN CONTAINER */
    .stream-hub-container {
      display: flex;
      gap: 24px;
      max-width: 1100px;
      width: 95%;
      margin: 30px auto;
      background: #0d0d14;
      padding: 24px;
      border-radius: 16px;
      border: 1px solid #1f1f2e;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      flex: 1;
    }

    /* VIDEO PLAYER BOX (LEFT) */
    .stream-player-box {
      flex: 1.6;
      min-width: 0;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #28283a;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 25px rgba(0,0,0,0.7);
    }
    .stream-player-box iframe,
    .stream-player-box video {
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
    }

    /* RIGHT COLUMN */
    .stream-info-column {
      flex: 1;
      min-width: 290px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* SPEC CARD */
    .stream-card {
      background: #14141e;
      border-radius: 12px;
      padding: 20px;
      border: 1px solid #232332;
    }
    .stream-file-title {
      font-size: 15px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 14px;
      line-height: 1.4;
      word-break: break-all;
    }
    .stream-spec-row {
      font-size: 13px;
      color: #a0a0b2;
      margin-bottom: 7px;
    }
    .stream-spec-row b { color: #fff; }

    /* ACTION BUTTONS */
    .stream-btn-group {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }
    .btn-stream-action {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 700;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-blue-dl {
      background: #0070f3;
      color: #ffffff !important;
      box-shadow: 0 4px 15px rgba(0, 112, 243, 0.4);
    }
    .btn-blue-dl:hover { background: #0051b3; transform: translateY(-2px); }

    .btn-gray-copy {
      background: #282838;
      color: #ffffff !important;
      border: 1px solid #3c3c50;
    }
    .btn-gray-copy:hover { background: #38384d; transform: translateY(-2px); }

    /* TELEGRAM PROMO CARD */
    .tg-promo-card {
      background: #14141e;
      border-radius: 12px;
      padding: 20px;
      border: 1px solid #232332;
      text-align: center;
    }
    .tg-promo-text {
      font-size: 13px;
      font-weight: 600;
      color: #e0e0f0;
      margin-bottom: 14px;
      line-height: 1.5;
    }
    .btn-tg-join-purple {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      background: linear-gradient(135deg, #8a2be2, #6a0dad);
      color: #ffffff !important;
      text-decoration: none;
      font-size: 14px;
      font-weight: 800;
      box-shadow: 0 4px 15px rgba(138, 43, 226, 0.4);
      transition: 0.2s;
    }
    .btn-tg-join-purple:hover {
      background: linear-gradient(135deg, #9b40f7, #7b12c7);
      transform: translateY(-2px);
    }

    /* FOOTER */
    footer {
      text-align: center;
      padding: 20px;
      background: #040406;
      color: #777;
      font-size: 12px;
      border-top: 1px solid #14141a;
      margin-top: auto;
    }

    @media (max-width: 850px) {
      .stream-hub-container { flex-direction: column; padding: 16px; margin: 15px auto; }
      .stream-info-column { width: 100%; min-width: 100%; }
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <header class="stream-nav">
    <a href="https://helaflix.blogspot.com" class="brand-logo">HELA<span>FLIX</span> STREAM</a>
  </header>

  <!-- STREAM & DOWNLOAD HUB -->
  <div class="stream-hub-container">

    <!-- VIDEO PLAYER (LEFT) -->
    <div class="stream-player-box" id="playerBox">
      <!-- Auto Injected via Script -->
    </div>

    <!-- RIGHT COLUMN (SPECS & ACTIONS) -->
    <div class="stream-info-column">

      <!-- SPECS & DOWNLOAD CARD -->
      <div class="stream-card">
        <div class="stream-file-title" id="fileTitle">Movie Title Loading...</div>
        
        <div class="stream-spec-row">
          📦 <b>Size:</b> <span id="fileSize">-- MB</span>
        </div>
        <div class="stream-spec-row">
          📐 <b>Resolution:</b> <span id="fileRes">1280x720 HD</span>
        </div>

        <div class="stream-btn-group">
          <a href="#" id="btnDownload" class="btn-stream-action btn-blue-dl" target="_blank">Download</a>
          <button class="btn-stream-action btn-gray-copy" onclick="copyDownloadLink()">Copy Link</button>
        </div>
      </div>

      <!-- TELEGRAM PROMO CARD (LINKED TO HELAFLIX) -->
      <div class="tg-promo-card">
        <div class="tg-promo-text">
          🥰 තවත් මේ වගේම මූවීස් බලන්න අපේ telegram channel එකට join වෙන්න
        </div>
        <a href="https://t.me/helaflix" class="btn-tg-join-purple" target="_blank">
          <i class="fa-brands fa-telegram"></i> Join Telegram Channel
        </a>
      </div>

    </div>

  </div>

  <footer>
    <p>&#169; HELAFLIX - High Speed Cloud Streaming &amp; Download Portal.</p>
  </footer>

  <!-- DYNAMIC PLAYER & GOOGLE DRIVE HANDLER SCRIPT -->
  <script>
    const urlParams = new URLSearchParams(window.location.search);

    const title = urlParams.get('title') || 'Movie / Episode Stream';
    const size = urlParams.get('size') || '750 MB';
    const res = urlParams.get('res') || '1280x720 HD';
    let streamUrl = urlParams.get('stream') || '';
    let dlUrl = urlParams.get('dl') || streamUrl;

    document.getElementById('fileTitle').innerText = title;
    document.getElementById('fileSize').innerText = size;
    document.getElementById('fileRes').innerText = res;

    const playerBox = document.getElementById('playerBox');

    // Check if link is Google Drive or has Drive File ID
    const driveMatch = streamUrl.match(/[-\w]{25,}/);
    const isDrive = streamUrl.includes('drive.google.com') || streamUrl.includes('google') || driveMatch;

    if (isDrive && driveMatch) {
      const fileId = driveMatch[0];
      // Load Google Drive Official Ultra-Fast Stream Engine
      playerBox.innerHTML = `
        <iframe src="https://drive.google.com/file/d/${fileId}/preview" allow="autoplay; fullscreen" allowfullscreen></iframe>
      `;
      // Direct Download link
      document.getElementById('btnDownload').href = `https://drive.google.com/uc?export=download&id=${fileId}`;
    } else if (streamUrl) {
      // Direct MP4 Video Player
      playerBox.innerHTML = `
        <video controls autoplay preload="metadata" style="width:100%; height:100%;">
          <source src="${streamUrl}" type="video/mp4" />
          Browser does not support video playback.
        </video>
      `;
      document.getElementById('btnDownload').href = dlUrl;
    } else {
      playerBox.innerHTML = `<div style="color:#777; font-size:13px;">No stream link provided.</div>`;
    }

    function copyDownloadLink() {
      const finalLink = document.getElementById('btnDownload').href || window.location.href;
      navigator.clipboard.writeText(finalLink).then(() => {
        alert("✅ Download Link එක සාර්ථකව Copy විය!");
      });
    }
  </script>

</body>
</html>
