<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch & Download - HelaFlix Stream</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #08080a;
      color: #ffffff;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* NAVBAR */
    .stream-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 5%;
      background: rgba(10, 10, 14, 0.98);
      border-bottom: 1px solid #1a1a24;
    }
    .brand-logo {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #fff;
      text-decoration: none;
    }
    .brand-logo span { color: #e50914; }

    /* THEATER MAIN CONTAINER */
    .theater-container {
      max-width: 1100px;
      width: 95%;
      margin: 25px auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      flex: 1;
    }

    /* 1. YOUTUBE-STYLE WIDESCREEN PLAYER (16:9) */
    .theater-player-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid #222232;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .theater-player-box iframe,
    .theater-player-box video {
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
    }

    /* 2. DETAILS & ACTION BAR (BELOW PLAYER) */
    .theater-info-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #12121a;
      padding: 20px 24px;
      border-radius: 14px;
      border: 1px solid #1f1f2e;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
      flex-wrap: wrap;
      gap: 15px;
    }

    .theater-meta {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .theater-title {
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.3;
    }
    .theater-specs {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .spec-pill {
      font-size: 13px;
      color: #a0a0b2;
      background: #1c1c28;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid #28283a;
    }
    .spec-pill b { color: #fff; }

    /* ACTION BUTTONS */
    .theater-actions {
      display: flex;
      gap: 12px;
    }
    .btn-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 22px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-blue-dl {
      background: #0070f3;
      color: #ffffff !important;
      box-shadow: 0 4px 15px rgba(0, 112, 243, 0.4);
    }
    .btn-blue-dl:hover { background: #0051b3; transform: translateY(-2px); }

    .btn-gray-copy {
      background: #242432;
      color: #ffffff !important;
      border: 1px solid #38384d;
    }
    .btn-gray-copy:hover { background: #323244; transform: translateY(-2px); }

    /* 3. TELEGRAM PROMO BANNER */
    .theater-tg-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #12121a;
      padding: 18px 24px;
      border-radius: 14px;
      border: 1px solid #1f1f2e;
      flex-wrap: wrap;
      gap: 15px;
    }
    .tg-text {
      font-size: 14px;
      font-weight: 600;
      color: #e0e0f0;
    }
    .btn-tg-purple {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 8px;
      background: linear-gradient(135deg, #8a2be2, #6a0dad);
      color: #ffffff !important;
      text-decoration: none;
      font-size: 14px;
      font-weight: 800;
      box-shadow: 0 4px 15px rgba(138, 43, 226, 0.4);
      transition: 0.2s;
    }
    .btn-tg-purple:hover {
      background: linear-gradient(135deg, #9b40f7, #7b12c7);
      transform: translateY(-2px);
    }

    /* FOOTER */
    footer {
      text-align: center;
      padding: 20px;
      background: #040406;
      color: #777;
      font-size: 12px;
      border-top: 1px solid #14141a;
      margin-top: auto;
    }

    @media (max-width: 768px) {
      .theater-info-bar, .theater-tg-card { flex-direction: column; align-items: flex-start; }
      .theater-actions, .btn-tg-purple { width: 100%; }
      .btn-action { flex: 1; }
      .theater-title { font-size: 17px; }
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <header class="stream-nav">
    <a href="https://helaflix.blogspot.com" class="brand-logo">HELA<span>FLIX</span> STREAM</a>
  </header>

  <!-- THEATER MAIN WRAPPER -->
  <div class="theater-container">

    <!-- 1. YOUTUBE / NETFLIX WIDESCREEN 16:9 PLAYER -->
    <div class="theater-player-box" id="playerBox">
      <!-- High Speed Video Player -->
    </div>

    <!-- 2. DETAILS & DOWNLOAD ACTIONS BAR -->
    <div class="theater-info-bar">
      <div class="theater-meta">
        <h1 class="theater-title" id="fileTitle">Movie Title Loading...</h1>
        <div class="theater-specs">
          <span class="spec-pill">📦 <b id="fileSize">-- MB</b></span>
          <span class="spec-pill">📐 <b id="fileRes">720p HD</b></span>
        </div>
      </div>

      <div class="theater-actions">
        <a href="#" id="btnDownload" class="btn-action btn-blue-dl" target="_blank">
          <i class="fa-solid fa-download"></i> Download
        </a>
        <button class="btn-action btn-gray-copy" onclick="copyDownloadLink()">
          <i class="fa-solid fa-link"></i> Copy Link
        </button>
      </div>
    </div>

    <!-- 3. TELEGRAM COMMUNITY CARD -->
    <div class="theater-tg-card">
      <div class="tg-text">
        🥰 තවත් මේ වගේම මූවීස් බලන්න අපේ telegram channel එකට join වෙන්න
      </div>
      <a href="https://t.me/helaflix" class="btn-tg-purple" target="_blank">
        <i class="fa-brands fa-telegram"></i> Join Telegram Channel
      </a>
    </div>

  </div>

  <footer>
    <p>&#169; HELAFLIX - High Speed Cloud Streaming &amp; Download Portal.</p>
  </footer>

  <!-- DYNAMIC PARSER SCRIPT -->
  <script>
    const urlParams = new URLSearchParams(window.location.search);

    const title = urlParams.get('title') || 'Movie / Episode Stream';
    const size = urlParams.get('size') || '750 MB';
    const res = urlParams.get('res') || '1280x720 HD';

    // Extract File ID
    const rawInput = urlParams.get('id') || urlParams.get('stream') || window.location.search;
    const match = rawInput.match(/[-\w]{25,}/);
    const fileId = match ? match[0] : '1wwEj0cIAYTrjZM1AKds5EcPRbV8VJp1t';

    document.getElementById('fileTitle').innerText = title;
    document.getElementById('fileSize').innerText = size;
    document.getElementById('fileRes').innerText = res;

    // Load Widescreen Cinema Player
    document.getElementById('playerBox').innerHTML = `
      <iframe src="https://drive.google.com/file/d/${fileId}/preview" allow="autoplay; fullscreen" allowfullscreen></iframe>
    `;

    // 100% Working Direct Download link
    const downloadUrl = `https://drive.usercontent.google.com/download?id=${fileId}&export=download&authuser=0`;
    document.getElementById('btnDownload').href = downloadUrl;

    function copyDownloadLink() {
      navigator.clipboard.writeText(downloadUrl).then(() => {
        alert("✅ Direct Download Link එක සාර්ථකව Copy විය!");
      });
    }
  </script>

</body>
</html>
