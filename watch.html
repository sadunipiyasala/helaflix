<script>
        // URL එකෙන් Message ID එක සහ නම ලබාගැනීම
        const urlParams = new URLSearchParams(window.location.search);
        const msgId = urlParams.get('id'); // Telegram Message ID එක
        const movieTitle = urlParams.get('title');

        if (msgId) {
            // අපේම Vercel API එක හරහා වීඩියෝ ලින්ක් එක හැදීම
            const videoStreamUrl = `/api/stream?id=${msgId}`;
            
            document.getElementById('video-source').src = videoStreamUrl;
            document.getElementById('movie-video').load();
            document.getElementById('download-btn').href = videoStreamUrl;
        }

        if (movieTitle) {
            const decodedTitle = decodeURIComponent(movieTitle);
            document.getElementById('movie-title').innerText = "Title: " + decodedTitle;
            document.getElementById('page-title').innerText = decodedTitle + " - HelaFlix";
        } else {
            document.getElementById('movie-title').innerText = "Title: Movie File.mp4";
        }

        function copyLink() {
            navigator.clipboard.writeText(window.location.href);
            alert("Link Copied to Clipboard!");
        }
    </script>
