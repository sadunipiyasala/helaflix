<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch & Download - HelaFlix Stream</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #08080a;
      color: #ffffff;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* NAVBAR */
    .stream-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 5%;
      background: rgba(10, 10, 14, 0.98);
      border-bottom: 1px solid #1a1a24;
    }
    .brand-logo {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #fff;
      text-decoration: none;
    }
    .brand-logo span { color: #e50914; }

    /* THEATER CONTAINER */
    .theater-container {
      max-width: 1100px;
      width: 95%;
      margin: 25px auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      flex: 1;
    }

    /* 1. UNIVERSAL WIDESCREEN 16:9 PLAYER */
    .theater-player-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid #222232;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .theater-player-box iframe,
    .theater-player-box video {
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
    }

    /* 2. DETAILS & ACTION BAR */
    .theater-info-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #12121a;
      padding: 20px 24px;
      border-radius: 14px;
      border: 1px solid #1f1f2e;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
      flex-wrap: wrap;
      gap: 15px;
    }

    .theater-meta {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .badge-dub-red {
      display: inline-block;
      background: #e50914;
      color: #ffffff;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 5px;
      width: fit-content;
      text-transform: uppercase;
      box-shadow: 0 2px 8px rgba(229, 9, 20, 0.4);
    }

    .theater-title {
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.35;
    }
    .theater-specs {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .spec-pill {
      font-size: 13px;
      color: #a0a0b2;
      background: #1c1c28;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid #28283a;
    }
    .spec-pill b { color: #fff; }

    /* ACTION BUTTONS */
    .theater-actions {
      display: flex;
      gap: 12px;
    }
    .btn-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 22px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-blue-dl {
      background: #0070f3;
      color: #ffffff !important;
      box-shadow: 0 4px 15px rgba(0, 112, 243, 0.4);
    }
    .btn-blue-dl:hover { background: #0051b3; transform: translateY(-2px); }

    .btn-gray-copy {
      background: #242432;
      color: #ffffff !important;
      border: 1px solid #38384d;
    }
    .btn-gray-copy:hover { background: #323244; transform: translateY(-2px); }

    /* 3. TELEGRAM PROMO CARD */
    .theater-tg-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #12121a;
      padding: 18px 24px;
      border-radius: 14px;
      border: 1px solid #1f1f2e;
      flex-wrap: wrap;
      gap: 15px;
    }
    .tg-text {
      font-size: 14px;
      font-weight: 600;
      color: #e0e0f0;
    }
    .btn-tg-purple {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 8px;
      background: linear-gradient(135deg, #8a2be2, #6a0dad);
      color: #ffffff !important;
      text-decoration: none;
      font-size: 14px;
      font-weight: 800;
      box-shadow: 0 4px 15px rgba(138, 43, 226, 0.4);
      transition: 0.2s;
    }
    .btn-tg-purple:hover {
      background: linear-gradient(135deg, #9b40f7, #7b12c7);
      transform: translateY(-2px);
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #040406;
      color: #777;
      font-size: 12px;
      border-top: 1px solid #14141a;
      margin-top: auto;
    }

    @media (max-width: 768px) {
      .theater-info-bar, .theater-tg-card { flex-direction: column; align-items: flex-start; }
      .theater-actions, .btn-tg-purple { width: 100%; }
      .btn-action { flex: 1; }
      .theater-title { font-size: 17px; }
    }
  </style>
</head>
<body>

  <header class="stream-nav">
    <a href="https://helaflix.blogspot.com" class="brand-logo">HELA<span>FLIX</span> STREAM</a>
  </header>

  <div class="theater-container">

    <!-- 1. UNIVERSAL PLAYER BOX -->
    <div class="theater-player-box" id="playerBox"></div>

    <!-- 2. DETAILS & DOWNLOAD ACTIONS -->
    <div class="theater-info-bar">
      <div class="theater-meta">
        <span class="badge-dub-red">සිංහල හඬකැවූ</span>
        <h1 class="theater-title" id="fileTitle">Movie Title Loading...</h1>
        <div class="theater-specs">
          <span class="spec-pill">📦 <b id="fileSize">-- MB</b></span>
          <span class="spec-pill">📐 <b id="fileRes">720p HD</b></span>
        </div>
      </div>

      <div class="theater-actions">
        <a href="#" id="btnDownload" class="btn-action btn-blue-dl" target="_blank">
          <i class="fa-solid fa-download"></i> Download
        </a>
        <button class="btn-action btn-gray-copy" onclick="copyDownloadLink()">
          <i class="fa-solid fa-link"></i> Copy Link
        </button>
      </div>
    </div>

    <!-- 3. TELEGRAM PROMO CARD -->
    <div class="theater-tg-card">
      <div class="tg-text">
        🥰 තවත් මේ වගේම මූවීස් බලන්න අපේ telegram channel එකට join වෙන්න
      </div>
      <a href="https://t.me/helaflix" class="btn-tg-purple" target="_blank">
        <i class="fa-brands fa-telegram"></i> Join Telegram Channel
      </a>
    </div>

  </div>

  <footer>
    <p>&#169; HELAFLIX - High Speed Cloud Streaming &amp; Download Portal.</p>
  </footer>

  <!-- UNIVERSAL STREAM ENGINE SCRIPT (DRIVE + DAILYMOTION + DIRECT) -->
  <script>
    const searchParams = new URLSearchParams(window.location.search);

    let rawInput = searchParams.get('id') || searchParams.get('stream') || '';
    let rawTitle = searchParams.get('title') || 'Movie Stream';
    let rawSize = searchParams.get('size') || '750 MB';
    let rawRes = searchParams.get('res') || '720p HD';
    let dlParam = searchParams.get('dl') || '';

    // Clean Decode
    document.getElementById('fileTitle').innerText = decodeURIComponent(rawTitle.replace(/\+/g, ' '));
    document.getElementById('fileSize').innerText = decodeURIComponent(rawSize.replace(/\+/g, ' '));
    document.getElementById('fileRes').innerText = decodeURIComponent(rawRes.replace(/\+/g, ' '));

    const playerBox = document.getElementById('playerBox');
    let downloadUrl = dlParam;

    // 1. CHECK IF DAILYMOTION VIDEO
    if (rawInput.includes('dailymotion.com') || rawInput.includes('dai.ly') || rawInput.startsWith('x')) {
      let dmId = rawInput;
      let match = rawInput.match(/video\/([a-zA-Z0-9]+)/) || rawInput.match(/dai\.ly\/([a-zA-Z0-9]+)/);
      if (match) dmId = match[1];
      
      // Embed Dailymotion High Speed Player
      playerBox.innerHTML = `
        <iframe src="https://www.dailymotion.com/embed/video/${dmId}?autoplay=0" allow="autoplay; fullscreen" allowfullscreen></iframe>
      `;
      if (!downloadUrl) downloadUrl = `https://www.dailymotion.com/video/${dmId}`;
    }
    // 2. CHECK IF GOOGLE DRIVE VIDEO
    else if (rawInput.includes('drive.google.com') || rawInput.match(/[-\w]{25,}/)) {
      let driveMatch = rawInput.match(/[-\w]{25,}/);
      let fileId = driveMatch ? driveMatch[0] : rawInput;

      playerBox.innerHTML = `
        <iframe src="https://drive.google.com/file/d/${fileId}/preview" allow="autoplay; fullscreen" allowfullscreen></iframe>
      `;
      if (!downloadUrl) downloadUrl = `https://drive.usercontent.google.com/download?id=${fileId}&export=download&authuser=0`;
    }
    // 3. DIRECT MP4 / STREAM URL
    else if (rawInput) {
      playerBox.innerHTML = `
        <video controls preload="metadata" style="width:100%; height:100%;">
          <source src="${rawInput}" type="video/mp4" />
        </video>
      `;
      if (!downloadUrl) downloadUrl = rawInput;
    } else {
      playerBox.innerHTML = `<div style="color:#777;">No video source found.</div>`;
    }

    document.getElementById('btnDownload').href = downloadUrl;

    function copyDownloadLink() {
      navigator.clipboard.writeText(downloadUrl).then(() => alert("✅ Link එක Copy විය!"));
    }
  </script>

</body>
</html>
